# Production stack on the EC2 host. Run only via infra/scripts/deploy.sh (it renders /etc/lexforgex/app.env from SSM first).
name: lexforgex

x-app: &app
  image: lexforgex-app:latest
  env_file: /etc/lexforgex/app.env
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '5' }

services:
  # PostgreSQL on the same host. No `ports:` on purpose: only containers on this Compose network can reach it.
  # Data lives in the named volume `pgdata` (on the EC2 root disk). Never run `docker volume prune` or
  # `docker compose down -v` here: that deletes the database. POSTGRES_* come from /etc/lexforgex/db.env
  # (written by render-env.sh); this container deliberately does not get the app's other secrets.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: /etc/lexforgex/db.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  api:
    <<: *app
    command: ['node', 'apps/api/dist/server.js']
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/health/ready']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    command: ['node', 'apps/api/dist/worker.js']
    depends_on:
      postgres: { condition: service_healthy }

  caddy:
    image: lexforgex-web:latest
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN missing}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL missing}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  # One-off: database migrations. `docker compose run --rm migrate`
  migrate:
    <<: *app
    restart: 'no'
    profiles: ['tools']
    depends_on:
      postgres: { condition: service_healthy }
    working_dir: /repo/packages/db
    command: ['./node_modules/.bin/tsx', 'src/cli.ts', 'migrate']

  # One-off: platform admin CLI. `docker compose run --rm admin -- --email … --name …`
  admin:
    <<: *app
    restart: 'no'
    profiles: ['tools']
    depends_on:
      postgres: { condition: service_healthy }
    working_dir: /repo/apps/api
    entrypoint: ['./node_modules/.bin/tsx', 'src/scripts/create-platform-admin.ts']

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
