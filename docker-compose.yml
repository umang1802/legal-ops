name: legalops
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: legalops
      POSTGRES_PASSWORD: legalops
      POSTGRES_DB: legalops
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalops"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: legalops
      MINIO_ROOT_PASSWORD: legalops-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

volumes:
  pgdata:
  miniodata:
