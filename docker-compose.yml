name: legalops
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: legalops
      POSTGRES_PASSWORD: legalops
      POSTGRES_DB: legalops
    ports: ['5433:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U legalops']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6380:6379']

  # Local S3-compatible document store (the minio/minio image is no longer published publicly). S3 API on :9000.
  # Unauthenticated: dev only. Buckets are created on first use by `pnpm dev:storage`.
  s3:
    image: chrislusf/seaweedfs:latest
    # Dev-only keys (same as .env.example). With an identity configured, unsigned requests are refused, as on AWS.
    command: server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    ports: ['9000:8333']
    volumes: [s3data:/data, ./infra/dev/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro]

  # Local mail catcher: the app really sends over SMTP; read every email at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  s3data:
